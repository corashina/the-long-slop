<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Desert Drive</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <canvas id="game" aria-label="Desert scene" tabindex="0"></canvas>
      <section id="start-screen" aria-labelledby="title">
        <p class="eyebrow">Desert Drive</p>
        <h1 id="title">A road through the desert.</h1>
        <p id="status" role="status" aria-live="polite">Loading the game…</p>
        <p class="controls">W / S or ↑ / ↓: drive and brake<br>A / D or ← / →: steer · Space: handbrake<br>C: camera · E: refuel · R: recover · P / Esc: pause</p>
        <button id="start" type="button" disabled>Start</button>
      </section>
      <aside id="hud" hidden>
        <div><strong id="speed">0</strong> km/h <span id="camera-mode">Chase</span></div>
        <div class="readouts"><span><span id="fuel">12.0</span> / 40 L</span><span><span id="trip">0.00</span> km</span></div>
        <p id="refuel-prompt" role="status"></p>
        <button id="pause" type="button">Pause</button>
        <button id="fullscreen" type="button">Fullscreen</button>
      </aside>
      <section id="pause-screen" aria-labelledby="pause-title" hidden>
        <h2 id="pause-title">Paused</h2>
        <p>Press P or Esc to resume.</p>
        <p class="controls">E: refuel · R: recover · C: camera</p>
        <button id="resume" type="button">Resume</button>
        <button id="restart" type="button">Restart</button>
      </section>
      <p id="runtime-error" role="alert" hidden></p>
      <noscript>Enable JavaScript to load the game.</noscript>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
