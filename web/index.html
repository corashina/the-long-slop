<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Desert Drive</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <canvas id="game" aria-label="Desert scene" tabindex="0"></canvas>
      <section id="start-screen" aria-labelledby="title">
        <p class="eyebrow">Desert Drive</p>
        <h1 id="title">A road through the desert.</h1>
        <p id="status" role="status" aria-live="polite">Loading the game…</p>
        <p class="controls">W / S: drive and brake · A / D: steer<br>Space: handbrake · C: camera · R: recover</p>
        <button id="start" type="button" disabled>Start</button>
      </section>
      <aside id="hud" hidden><strong id="speed">0</strong> km/h <span id="camera-mode">Chase</span></aside>
      <p id="runtime-error" role="alert" hidden></p>
      <noscript>Enable JavaScript to load the game.</noscript>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
