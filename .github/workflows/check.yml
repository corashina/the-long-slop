name: Check

on:
  pull_request:
  push:
    branches: [master]

jobs:
  rust:
    runs-on: ubuntu-latest
    # The same Rust image as tools/Dockerfile.
    container: rust@sha256:6ff07edce8775d0f64be7aba9197229407301bddf2054d62c27b541a6238a181
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --release --target wasm32-unknown-unknown --lib -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --target wasm32-unknown-unknown --lib

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/web/*.test.mjs

  exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/reference/requirements.txt
      - run: python -m unittest discover -s tools/reference/tests
