[package]
name = "my-summer-slop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rapier3d = "=0.36.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "std", "async_executor", "bevy_asset", "bevy_log", "bevy_window",
    "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr",
    "bevy_light", "bevy_mesh", "bevy_camera", "bevy_color", "webgl2",
    "keyboard", "mouse", "bevy_gltf", "png", "reflect_auto_register",
] }
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "=0.1.7"
indexmap = "=2.14.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
